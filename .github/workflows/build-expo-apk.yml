name: Build Expo APK

on:
  push:
    branches:
      - mohamedtamemi-quran-android-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Install app dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build optimized arm64 APK
        working-directory: apps/mobile/android
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tamimi-mushaf-arm64-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
